org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Flutter stable 3.44+ supports AGP 9, but this project intentionally keeps
# the proven AGP 8/KGP path until all packaging plugins use built-in Kotlin.
# Declaring the legacy path also makes direct Gradle invocations deterministic
# instead of relying on the Flutter migrator to add these values first.
android.builtInKotlin=false
android.newDsl=false
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
