org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Flutter 3.47.0 supports AGP 9, but this project intentionally keeps
# the supported AGP 8.11/KGP 2.2 path until all plugins use built-in Kotlin.
# Declaring the legacy path also makes direct Gradle invocations deterministic
# instead of relying on the Flutter migrator to add these values first.
android.builtInKotlin=false
android.newDsl=false
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
