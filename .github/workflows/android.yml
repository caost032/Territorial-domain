name: Flutter FFI release gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ffi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-and-flutter:
    name: C11, Dart and APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Test and harden the C11 core
        run: make test soak native host-check

      - name: Sanitize the C11 core
        run: make asan

      - name: Resolve Flutter dependencies
        working-directory: app/flutter
        run: flutter pub get

      - name: Parse, analyze and test Dart
        working-directory: app/flutter
        run: |
          dart format lib test
          git diff --patch -- lib test
          flutter analyze
          flutter test

      - name: Configure the Flutter packaging toolchain
        run: |
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' \
            "$ANDROID_SDK_ROOT" "$FLUTTER_ROOT" \
            > app/flutter/android/local.properties
          gradle -p app/flutter/android wrapper \
            --gradle-version 8.10.2 --distribution-type bin
          chmod +x app/flutter/android/gradlew

      - name: Build universal APK
        working-directory: app/flutter
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64,android-x64
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            dist/ODPAR-Territorial-Domain-api14-universal.apk

      - name: Build ABI-split APKs
        working-directory: app/flutter
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64,android-x64
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            dist/ODPAR-Territorial-Domain-api14-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            dist/ODPAR-Territorial-Domain-api14-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            dist/ODPAR-Territorial-Domain-api14-x86_64.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Verify packaged native ABIs
        working-directory: app/flutter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          dist = Path("dist")
          stem = "ODPAR-Territorial-Domain-api14"
          abis = ("arm64-v8a", "armeabi-v7a", "x86_64")

          def entries(name: str) -> set[str]:
              with ZipFile(dist / name) as archive:
                  return set(archive.namelist())

          universal = entries(f"{stem}-universal.apk")
          for abi in abis:
              library = f"lib/{abi}/libodpar_territorial_domain.so"
              if library not in universal:
                  raise SystemExit(f"universal APK is missing {library}")
              split = entries(f"{stem}-{abi}.apk")
              if library not in split:
                  raise SystemExit(f"{abi} APK is missing {library}")
          PY

      - name: Publish APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: odpar-flutter-apk-api14
          path: app/flutter/dist/
          if-no-files-found: error
          retention-days: 14

  wasm-preview:
    name: Authoritative WASM preview
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install clang and lld
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang lld
          clang --version
          ld.lld --version

      - name: Compile and smoke-test API 14 WASM
        run: |
          make wasm CLANG=clang
          node tools/wasm_smoke.mjs
          make bundle CLANG=clang
          test -s app/web/index.html
          test -s app/web/odpar_territorial_domain.wasm
          test -s app/web/ODPAR_Territorial_Domain.html

      - name: Publish web preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: odpar-wasm-preview-api14
          path: |
            app/web/index.html
            app/web/odpar_territorial_domain.wasm
            app/web/ODPAR_Territorial_Domain.html
          if-no-files-found: error
          retention-days: 14
